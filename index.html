<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Client · Đông Hải</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </symbol>
        <symbol id="i-bot" viewBox="0 0 24 24">
          <rect x="4" y="8" width="16" height="12" rx="3" />
          <path d="M12 8V4M9 13v1.5M15 13v1.5" />
          <circle cx="12" cy="3.5" r="1" />
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path
            d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"
          />
          <path d="M14 3v5h5M9 13h6M9 17h4" />
        </symbol>
        <symbol id="i-cal" viewBox="0 0 24 24">
          <rect x="4" y="5" width="16" height="15" rx="2" />
          <path d="M8 3v4M16 3v4M4 10h16" />
        </symbol>
        <symbol id="i-more" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1" />
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" />
        </symbol>
        <symbol id="i-send" viewBox="0 0 24 24">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </symbol>
        <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
        <symbol id="i-max" viewBox="0 0 24 24">
          <path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6 6 18" />
        </symbol>
        <symbol id="i-left" viewBox="0 0 24 24">
          <path d="m15 6-6 6 6 6" />
        </symbol>
        <symbol id="i-right" viewBox="0 0 24 24">
          <path d="m9 6 6 6-6 6" />
        </symbol>
        <symbol id="i-clip" viewBox="0 0 24 24">
          <path
            d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"
          />
        </symbol>
        <symbol id="i-up" viewBox="0 0 24 24">
          <path
            d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.5 1 2 3l-.5 3H19a2 2 0 0 1 2 2.3l-1 6A2 2 0 0 1 18 20H7"
          />
        </symbol>
        <symbol id="i-down" viewBox="0 0 24 24">
          <path
            d="M7 13V4H4v9zM7 13l4 7c1.5 0 2.5-1 2-3l-.5-3H19a2 2 0 0 0 2-2.3l-1-6A2 2 0 0 0 18 4H7"
          />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="12" rx="2" />
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
        </symbol>
      </defs>
    </svg>

    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg class="ic"><use href="#i-bot" /></svg>
        </div>
        <div>
          <div class="brand-title">RAG Client</div>
          <div class="brand-subtitle">
            Tìm tài liệu nội bộ và hỏi đáp với AI
          </div>
        </div>
      </div>
      <div class="top-actions">
        <label class="search-field top-search">
          <svg class="ic"><use href="#i-search" /></svg>
          <input
            id="globalSearch"
            type="search"
            placeholder="Tìm nhanh tài liệu…"
          />
        </label>
        <button class="avatar" type="button" aria-label="Tài khoản">P</button>
      </div>
    </header>

    <main class="page-shell" id="pageShell">
      <section class="documents-panel">
        <div class="section-heading">
          <h1>Tài liệu</h1>
          <p>Tìm kiếm và xem các tài liệu từ RAG_SERVICE</p>
        </div>

        <div class="filter-row">
          <label class="search-field doc-search">
            <svg class="ic"><use href="#i-search" /></svg>
            <input
              id="documentSearch"
              type="search"
              placeholder="Tìm theo tiêu đề, nội dung, tag…"
            />
          </label>
          <select id="sortSelect" aria-label="Sắp xếp">
            <option value="newest">Mới nhất</option>
            <option value="oldest">Cũ nhất</option>
            <option value="az">A → Z</option>
          </select>
        </div>

        <div class="category-tabs" id="categoryTabs" role="tablist"></div>
        <div class="document-count">
          <strong id="documentCount">0</strong> tài liệu
        </div>
        <div class="document-grid" id="documentGrid"></div>
        <nav class="pagination" id="pagination" aria-label="Phân trang"></nav>
      </section>

      <aside class="chat-panel" id="chatPanel" aria-label="Chat với Bot RAG">
        <div class="chat-header">
          <div class="chat-title-wrap">
            <div class="chat-bot-icon">
              <svg class="ic"><use href="#i-bot" /></svg>
            </div>
            <div>
              <div class="chat-title">Chat với Bot RAG</div>
              <div class="chat-subtitle">
                <span class="dot"></span>Hỏi đáp từ tài liệu doanh nghiệp
              </div>
            </div>
          </div>
          <div class="chat-header-actions">
            <button id="minimizeBtn" aria-label="Thu nhỏ">
              <svg class="ic"><use href="#i-min" /></svg>
            </button>
            <button id="expandBtn" aria-label="Phóng to">
              <svg class="ic"><use href="#i-max" /></svg>
            </button>
            <button id="closeBtn" aria-label="Đóng">
              <svg class="ic"><use href="#i-x" /></svg>
            </button>
          </div>
        </div>

        <div class="doc-type-select">
          <label for="chatDocumentType">Loại tài liệu</label>
          <select id="chatDocumentType">
            <option value="all">Tất cả tài liệu</option>
            <option value="product">Sản phẩm</option>
            <option value="policy">Chính sách</option>
            <option value="guide">Hướng dẫn</option>
            <option value="faq">FAQ</option>
            <option value="other">Khác</option>
          </select>
        </div>

        <div class="chat-body" id="chatBody">
          <div class="messages" id="messages" aria-live="polite"></div>
        </div>

        <div class="chat-input-wrap">
          <button class="icon-btn" title="Đính kèm" aria-label="Đính kèm">
            <svg class="ic"><use href="#i-clip" /></svg>
          </button>
          <input
            id="chatInput"
            type="text"
            placeholder="Nhập câu hỏi của bạn…"
            autocomplete="off"
          />
          <button class="send-btn" id="sendBtn" aria-label="Gửi">
            <svg class="ic"><use href="#i-send" /></svg>
          </button>
        </div>
      </aside>
    </main>

    <button class="chat-launcher hidden" id="chatLauncher" aria-label="Mở chat">
      <svg class="ic"><use href="#i-bot" /></svg>
    </button>

    <script src="script.js"></script>
  </body>
</html>
