name: mshai-rag-client

services:
  rag-client:
    build:
      context: .
      dockerfile: Dockerfile

    image: mshai-rag-client:2026.10.28

    env_file:
      - ./backend/.env.docker

    ports:
      - "127.0.0.1:8100:8100"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
